<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-background dark:bg-on-background flex justify-between items-center px-container-margin h-16 w-full flat no-shadows">
<!-- Leading Action (Back) -->
<button class="text-primary dark:text-primary-fixed hover:text-primary transition-colors duration-200 Active: opacity-80 transition-opacity p-2 -ml-2 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Headline / Brand -->
<div class="font-display-lg-mobile text-display-lg-mobile italic text-primary dark:text-primary-fixed md:font-display-lg md:text-display-lg">
            The Review
        </div>
<!-- Trailing Action (Publish) -->
<button class="bg-primary text-on-primary font-label-md text-label-md px-4 py-2 rounded-full hover:bg-primary/90 transition-colors duration-200 shadow-[0px_4px_20px_rgba(0,0,0,0.04)] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
            Publish
        </button>
</header>
<!-- Main Editor Canvas -->
<main class="flex-grow w-full max-w-[800px] mx-auto px-container-margin py-stack-lg flex flex-col items-center">
<div class="w-full max-w-[680px]"> <!-- Optimal reading/writing width -->
<!-- Title Input -->
<textarea class="w-full bg-transparent border-none focus:ring-0 font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md text-on-surface placeholder:text-outline-variant p-0 mb-stack-md resize-none overflow-hidden auto-resize" id="title-input" placeholder="Title" rows="1"></textarea>
<!-- Formatting Toolbar (Sticky) -->
<div class="sticky top-16 z-40 bg-background/95 backdrop-blur-sm py-2 mb-stack-sm flex gap-2 border-b border-outline-variant/30">
<button class="p-2 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Add Image">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
<div class="w-px h-6 bg-outline-variant/50 self-center mx-1"></div>
<button class="p-2 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Bold">
<span class="material-symbols-outlined font-bold" data-icon="format_bold">format_bold</span>
</button>
<button class="p-2 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Italic">
<span class="material-symbols-outlined italic" data-icon="format_italic">format_italic</span>
</button>
<button class="p-2 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Link">
<span class="material-symbols-outlined" data-icon="link">link</span>
</button>
<button class="p-2 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors" title="Quote">

</button>
<div class="w-px h-6 bg-outline-variant/50 self-center mx-1"></div>
<button class="p-2 rounded hover:bg-surface-container-high text-on-surface-variant transition-colors" title="More">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</div>
<!-- Story Input -->
<textarea class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant p-0 min-h-[50vh] resize-none overflow-hidden auto-resize leading-relaxed" id="story-input" placeholder="Tell your story..."></textarea>
</div>
</main>
<!-- BottomNavBar (Hidden on this transactional screen as per Semantic Shell Mandate) -->
<!-- NavigationDrawer (Hidden on this transactional screen) -->
<script>
        // Simple auto-resize for textareas to feel seamless
        const textareas = document.querySelectorAll('.auto-resize');
        
        function resize() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        }

        textareas.forEach(ta => {
            ta.addEventListener('input', resize, false);
            // Initial resize
            // ta.style.height = ta.scrollHeight + 'px'; 
            // Better initial setup: delay slightly to ensure rendering is complete
            setTimeout(() => {
                ta.style.height = 'auto';
                ta.style.height = ta.scrollHeight + 'px';
            }, 0);
        });
    </script>
